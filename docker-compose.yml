version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: charade-backend
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=sqlite:///./charade.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change}
    volumes:
      - ./backend/data:/app
    restart: unless-stopped
