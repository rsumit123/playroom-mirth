name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Tests marked `live` need a running server; they run in the e2e job.
      - run: python -m pytest --tb=short -q

  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  e2e:
    name: End-to-end (live backend + Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The backend only mints test users with ENVIRONMENT=test, and the Vite
      # dev server has no .env in CI, so point it at the backend explicitly.
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./e2e.db
      LIVE_API_BASE: http://localhost:8005
      PLAYWRIGHT_API_BASE: http://localhost:8005
      VITE_API_BASE: http://localhost:8005
      VITE_SOCKET_URL: http://localhost:8005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start backend on :8005
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --port 8005 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8005/docs > /dev/null && exit 0
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Live backend tests
        working-directory: backend
        # conftest wipes its own database before each test; keep it off the server's.
        env:
          DATABASE_URL: sqlite:///./test.db
        run: python -m pytest -m live --tb=short -q

      - name: Playwright (Mobile Chrome)
        working-directory: frontend
        run: npx playwright test --project "Mobile Chrome"

      - name: Backend log
        if: failure()
        working-directory: backend
        run: tail -n 200 uvicorn.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
